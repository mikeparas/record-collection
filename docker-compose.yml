services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_SUPERUSER}
      - POSTGRES_PASSWORD=${DB_SUPERUSER_PASS}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./secrets/.erlang.cookie:/var/lib/rabbitmq/.erlang.cookie
    environment:
      - RABBITMQ_DEFAULT_USER=${MQ_USER}
      - RABBITMQ_DEFAULT_PASS=${MQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 30s
      timeout: 30s
      retries: 3

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: api
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
    env_file:
      - .env 
    environment:
      - DB_NAME=${PROD_DB}
    ports:
      - "8000:8000"

  db_setup:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: db_setup
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
    env_file:
      - .env 
    profiles:
      - tools

  api_integrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: e2e
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
    env_file:
      - .env 
    environment:
      - DB_NAME=${TEST_DB}
    profiles:
      - tools

  enrich:
    build:
      context: .
      dockerfile: services/enrich/Dockerfile
      target: enrich
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/enrich:/app/services/enrich
    env_file:
      - .env
    environment:
      - DB_NAME=${PROD_DB}

  enrich_integrate:
    build:
      context: .
      dockerfile: services/enrich/Dockerfile
      target: integration
    mem_limit: 1gb
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/enrich:/app/services/enrich
    env_file:
      - .env 
    environment:
      - DB_NAME=${TEST_DB}
    profiles:
      - tools
    
  
  node_migrate:
    build:
      context: .
      dockerfile: services/enrich/Dockerfile
      target: node_migrate
    depends_on:
      enrich:
        condition: service_started
    volumes:
      - ./services/enrich:/app/services/enrich
    env_file:
      - .env
    profiles:
      - tools
    

volumes:
  postgres_data:
  rabbitmq_data: