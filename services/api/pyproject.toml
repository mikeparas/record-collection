[project]
name = "api"
version = "0.1.0"
description = "Record Collection API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.5.8",
    "alembic>=1.16.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.118.0",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "sqlalchemy[asyncio]>=2.0.43",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "typer>=0.19.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]