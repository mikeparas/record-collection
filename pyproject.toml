[project]
name = "record-collection"
version = "0.1.0"
description = "Python side of record collection monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.3",
    "api"
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.12",
    "asyncpg-stubs>=0.31.1",
    "pytest-asyncio>=1.3.0",
    "poethepoet>=0.40.0",
]

[tool.uv.workspace]
members = ["services/api"]

[tool.uv.sources]
api = {workspace = true}

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.ruff]
src = ["services/api"]

[tool.ruff.lint]
exclude = ["services/api/alembic/*"]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    "C90"
]

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-report term-missing --cov-report html"

[tool.poe.tasks.format]
sequence = [
    { cmd = "ruff check --select I --fix" },
    { cmd = "ruff format" }
]

[tool.poe.tasks.lint]
sequence = [
    { cmd = "ruff check" },
    { cmd = "mypy ." }
]

[tool.poe.tasks.precommit]
sequence = [
    { ref = "format" },
    { ref = "lint" }
]