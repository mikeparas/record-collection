name: CI Core Workflow

on:
  workflow_call:
    outputs:
      passed:
        description: "Python and Node tests passed"
        value: ${{ jobs.python.result == 'success' && jobs.node.result == 'success' }}

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - "services/api/**"
              - "pyproject.toml"
              - "uv.lock"
              - "services/api/Dockerfile"
            node:
              - "services/enrich/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "services/enrich/Dockerfile"
            shared:
              - "docker-compose.yml"
              - "Makefile"
              - ".github/workflows/ci-pr.yml"
              - ".github/workflows/ci-main.yml"
              - ".github/workflows/ci-core.yml"

  setup:
    name: Cache dependencies
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      
      - name: Install dependencies
        run: make sync

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/enrich/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  python:
    name: Python (unit → integration)
    runs-on: ubuntu-latest
    needs: [detect_changes, setup]
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Restore Python cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Run Python unit tests
        run: make test_api_unit

      - name: Restore Node cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/enrich/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Python integration tests
        run: make test_api_integrate

  node:
    name: Node (unit → integration)
    runs-on: ubuntu-latest
    needs: [detect_changes, setup]
    if: ${{ needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Restore Node cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/enrich/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Node unit tests
        run: make test_enrich_unit

      - name: Restore Python cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Run Node integration tests
        run: make test_enrich_integrate
