name: CI Core Workflow

on:
  workflow_call:
    outputs:
      passed:
        description: "Python and Node tests passed"
        value: ${{ jobs.python_unit.result == 'success' && jobs.node_unit.result == 'success'  && jobs.integration.result == 'success' }}

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4.0.1
        with:
          filters: |
            python:
              - "services/api/**"
              - "pyproject.toml"
              - "uv.lock"
              - "services/api/Dockerfile"
            node:
              - "services/enrich/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "services/enrich/Dockerfile"
            shared:
              - "docker-compose.yml"
              - "Makefile"
              - ".github/workflows/ci-pr.yml"
              - ".github/workflows/ci-main.yml"
              - ".github/workflows/ci-core.yml"

  setup:
    name: Download and cache dependencies
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.3
      
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      
      - name: Install dependencies
        run: make sync

      - name: Debug Node dependencies
        run: ls services/enrich/node_modules/typeorm

      - name: Cache Python dependencies
        uses: actions/cache@v5.0.5
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Cache root Node dependencies
        uses: actions/cache@v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-root-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-root-

      - name: Cache enrich service dependencies
        uses: actions/cache@v5.0.5
        with:
          path: services/enrich/node_modules
          key: ${{ runner.os }}-node-enrich-${{ hashFiles('services/enrich/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-enrich-

  python_unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    needs: [detect_changes, setup]
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Restore Python cache
        uses: actions/cache@v5.0.5
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Run Python unit tests
        run: make test_api_unit

  node_unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    needs: [detect_changes, setup]
    if: ${{ needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.3

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Restore root Node cache
        uses: actions/cache@v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-root-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-root-

      - name: Restore enrich service cache
        uses: actions/cache@v5.0.5
        with:
          path: services/enrich/node_modules
          key: ${{ runner.os }}-node-enrich-${{ hashFiles('services/enrich/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-enrich-

      - name: Run Node unit tests
        run: make test_enrich_unit

  integration:
    name: Integration tests (Python → Node)
    runs-on: ubuntu-latest
    needs: [python_unit, node_unit]
    if: ${{ always() && (needs.python_unit.result == 'success' || needs.node_unit.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.3
      
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Restore Python cache
        uses: actions/cache@v5.0.5
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Restore root Node cache
        uses: actions/cache@v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-root-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-root-

      - name: Restore enrich service cache
        uses: actions/cache@v5.0.5
        with:
          path: services/enrich/node_modules
          key: ${{ runner.os }}-node-enrich-${{ hashFiles('services/enrich/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-enrich-

      - name: Debug Node dependencies
        run: ls services/enrich/node_modules/typeorm

      - name: Integration test setup
        run: make test_integrate_pre

      - name: Run Python integration tests
        if: ${{ needs.python_unit.result == 'success' }}
        run: make api_integrate
      
      - name: Run Node integration tests
        if: ${{ needs.node_unit.result == 'success' }}
        run: make enrich_integrate

      - name: Integration test teardown
        run: make test_db_teardown