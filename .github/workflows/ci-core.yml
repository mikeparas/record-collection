name: CI Core Workflow

on:
  workflow_call:
    inputs:
      cache-key:
        description: "A unique key used for the cache"
        required: true
        type: string
    outputs:
      passed:
        description: "Python and Node tests passed"
        value: ${{ jobs.python_unit.result == 'success' && jobs.node_unit.result == 'success'  && jobs.integration.result == 'success' }}

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4.0.1
        with:
          filters: |
            python:
              - "services/api/**"
              - "pyproject.toml"
              - "uv.lock"
              - "services/api/Dockerfile"
            node:
              - "services/enrich/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "services/enrich/Dockerfile"
            shared:
              - "docker-compose.yml"
              - "Makefile"
              - ".github/workflows/ci-pr.yml"
              - ".github/workflows/ci-main.yml"
              - ".github/workflows/ci-core.yml"

  setup:
    name: Download and cache dependencies
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # - name: Set up Python
      #   uses: actions/setup-python@v6.2.0
      #   with:
      #     python-version-file: .python-version

      # - name: Set up uv
      #   uses: astral-sh/setup-uv@v8.1.0
      #   with:
      #     enable-cache: true

      - name: Set up Python
        uses: ./.github/actions/setup-python.yml

      # - name: Set up pnpm
      #   uses: pnpm/action-setup@v6.0.8
      
      # - name: Set up Node
      #   uses: actions/setup-node@v6.4.0
      #   with:
      #     node-version: "24"
      #     cache: pnpm

      - name: Set up Node
        uses: ./.github/actions/setup-node.yml
      
      - name: Install dependencies
        run: make sync

      - name: Cache Python dependencies
        uses: actions/cache/save@v5.0.5
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ inputs.cache-key }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Cache root Node dependencies
        uses: actions/cache/save@v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-root-${{ inputs.cache-key }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Cache enrich service dependencies
        uses: actions/cache/save@v5.0.5
        with:
          path: services/enrich/node_modules
          key: ${{ runner.os }}-node-enrich-${{ inputs.cache-key }}-${{ hashFiles('services/enrich/package.json', 'pnpm-lock.yaml') }}

  python_unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    needs: [detect_changes, setup]
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # - name: Set up Python
      #   uses: actions/setup-python@v6.2.0
      #   with:
      #     python-version-file: .python-version

      # - name: Set up uv
      #   uses: astral-sh/setup-uv@v8.1.0
      #   with:
      #     enable-cache: true
      - name: Set up Python
        uses: ./.github/actions/setup-python.yml

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Restore Python cache
        id: restore-python-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ inputs.cache-key }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install Python dependencies if cache is not found
        if: ${{ steps.restore-python-cache.outputs.cache-hit != 'true' }}
        run: make sync_api

      - name: Run Python unit tests
        run: make test_api_unit

  node_unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    needs: [detect_changes, setup]
    if: ${{ needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # - name: Set up pnpm
      #   uses: pnpm/action-setup@v6.0.8

      # - name: Set up Node
      #   uses: actions/setup-node@v6.4.0
      #   with:
      #     node-version: "24"
      #     cache: pnpm
      - name: Set up Node
        uses: ./.github/actions/setup-node.yml

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Restore root Node cache
        id: restore-root-node-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-root-${{ inputs.cache-key }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Restore enrich service cache
        id: restore-enrich-service-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: services/enrich/node_modules
          key: ${{ runner.os }}-node-enrich-${{ inputs.cache-key }}-${{ hashFiles('services/enrich/package.json', 'pnpm-lock.yaml') }}

      - name: Install Node dependencies if cache is not found
        if: ${{ steps.restore-root-node-cache.outputs.cache-hit != 'true' || steps.restore-enrich-service-cache.outputs.cache-hit != 'true' }}
        run: make sync_enrich

      - name: Run Node unit tests
        run: make test_enrich_unit

  integration:
    name: Integration tests (Python → Node)
    runs-on: ubuntu-latest
    needs: [python_unit, node_unit]
    if: ${{ always() && (needs.python_unit.result == 'success' || needs.node_unit.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # - name: Set up Python
      #   uses: actions/setup-python@v6.2.0
      #   with:
      #     python-version-file: .python-version

      # - name: Set up uv
      #   uses: astral-sh/setup-uv@v8.1.0
      #   with:
      #     enable-cache: true
      - name: Set up Python
        uses: ./.github/actions/setup-python.yml

      # - name: Set up pnpm
      #   uses: pnpm/action-setup@v6.0.8
      
      # - name: Set up Node
      #   uses: actions/setup-node@v6.4.0
      #   with:
      #     node-version: "24"
      #     cache: pnpm
      - name: Set up Node
        uses: ./.github/actions/setup-node.yml

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Restore Python cache
        id: restore-python-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ inputs.cache-key }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Restore root Node cache
        id: restore-root-node-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-root-${{ inputs.cache-key }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Restore enrich service cache
        id: restore-enrich-service-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: services/enrich/node_modules
          key: ${{ runner.os }}-node-enrich-${{ inputs.cache-key }}-${{ hashFiles('services/enrich/package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies if cache is not found
        if: ${{ steps.restore-python-cache.outputs.cache-hit != 'true' || steps.restore-root-node-cache.outputs.cache-hit != 'true' || steps.restore-enrich-service-cache.outputs.cache-hit != 'true' }}
        run: make sync

      - name: Integration test setup
        run: make test_integrate_pre

      - name: Run Python integration tests
        if: ${{ needs.python_unit.result == 'success' }}
        run: make api_integrate
      
      - name: Run Node integration tests
        if: ${{ needs.node_unit.result == 'success' }}
        run: make enrich_integrate

      - name: Integration test teardown
        run: make test_db_teardown