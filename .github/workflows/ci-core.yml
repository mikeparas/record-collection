name: CI Core Workflow

on:
  workflow_call:
    outputs:
      passed:
        description: "Python and Node tests passed"
        value: ${{ jobs.python_unit.result == 'success' && jobs.node_unit.result == 'success'  && jobs.integration.result == 'success' }}

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            python:
              - "services/api/**"
              - "pyproject.toml"
              - "uv.lock"
              - "services/api/Dockerfile"
            node:
              - "services/enrich/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "services/enrich/Dockerfile"
            shared:
              - "docker-compose.yml"
              - "Makefile"
              - ".github/workflows/ci-pr.yml"
              - ".github/workflows/ci-main.yml"
              - ".github/workflows/ci-core.yml"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: make sync

      - name: Run linters
        run: make lint

  python_unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    needs: [detect_changes, lint]
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Install Python dependencies
        run: make sync_api

      - name: Run Python unit tests
        run: make test_api_unit

  node_unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    needs: [detect_changes, lint]
    if: ${{ needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Install Node dependencies
        run: make sync_enrich

      - name: Run Node unit tests
        run: make test_enrich_unit

  integration:
    name: Integration tests (Python → Node)
    runs-on: ubuntu-latest
    needs: [python_unit, node_unit]
    if: ${{ always() && (needs.python_unit.result == 'success' || needs.node_unit.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Install dependencies
        run: make sync

      - name: Integration test setup
        run: make test_integrate_pre

      - name: Run Python integration tests
        if: ${{ needs.python_unit.result == 'success' }}
        run: make api_integrate
      
      - name: Run Node integration tests
        if: ${{ needs.node_unit.result == 'success' }}
        run: make enrich_integrate

      - name: Integration test teardown
        run: make test_db_teardown