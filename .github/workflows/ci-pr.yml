name: CI Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/api/**"
      - "services/enrich/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - "services/api/Dockerfile"
      - "services/enrich/Dockerfile"
      - "Makefile"
      - ".github/workflows/ci-pr.yml"
      - ".github/workflows/ci-main.yml"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - "services/api/**"
              - "pyproject.toml"
              - "uv.lock"
              - "services/api/Dockerfile"
            node:
              - "services/enrich/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "services/enrich/Dockerfile"
            shared:
              - "docker-compose.yml"
              - "Makefile"
              - ".github/workflows/ci-pr.yml"
              - ".github/workflows/ci-main.yml"

  python:
    name: Python (unit → integration)
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.python == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Install Python dependencies
        run: make sync_api

      - name: Run Python unit tests
        run: make test_api_unit

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Python integration tests
        run: make test_api_integrate

  node:
    name: Node (unit → integration)
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.node == 'true' || needs.detect_changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Prepare environment files
        run: cp .env.sample .env && make env_file && make secrets

      - name: Install Node dependencies
        run: make sync_enrich

      - name: Run Node unit tests
        run: make test_enrich_unit

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Node integration tests
        run: make test_enrich_integrate
